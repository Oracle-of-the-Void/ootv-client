name: Deploy

# dev    -> preview.oracleofthevoid.com (like sync-test.sh)
# master -> oracleofthevoid.com         (like sync-prod.sh)
on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Select target
        id: target
        run: |
          case "${{ github.ref_name }}" in
            master)
              echo "bucket=oracleofthevoid.com" >> $GITHUB_OUTPUT
              echo "distribution=E6ECGAAP7LNKR" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "bucket=preview.oracleofthevoid.com" >> $GITHUB_OUTPUT
              echo "distribution=E2S43UTDKL45NF" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "No deploy target for branch ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      # a late run (GitHub delays push events during incidents) mustn't put old code over a newer deploy
      - name: Still the newest?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/skip-stale.sh

      - name: Configure AWS credentials
        if: steps.newest.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref_name == 'master' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.REGION }}

      - name: Stamp version
        if: steps.newest.outputs.current == 'true'
        run: .github/stamp-version.sh "${GITHUB_SHA::12}"

      # Caching (see .github/stamp-version.sh):
      #   *.js, *.css, templates/*  versioned (?v=<commit>) -> cached a year, immutable
      #   pages, version.json, docs  revalidated on every load (no-cache; 304 when unchanged)
      #   everything else (images)   cached a day
      # CloudFront leaves the query string out of its cache key, so oracle.js?v=new could be
      # answered with the old oracle.js until the invalidation finishes, and a browser would
      # then keep that for a year. So: upload assets, invalidate and wait, and only then
      # upload the pages that point at the new URLs.
      - name: Sync to S3
        if: steps.newest.outputs.current == 'true'
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION: ${{ steps.target.outputs.distribution }}
        run: |
          junk=(--exclude '.DS*' --exclude '._*' --exclude '.git' --exclude '.git/*' --exclude '.gitignore'
                --exclude '*/.*' --exclude '*~' --exclude '*\+' --exclude '#*' --exclude '.swp*'
                --exclude '*/#*' --exclude '*/*\+' --exclude '*/*-prev'
                --exclude '.github' --exclude '.github/*')
          pages=(--exclude '*' --include '*.html' --include 'version.json' --exclude 'templates/*'
                 "${junk[@]}" --include 'docs/admin/*.md')

          # 1. versioned assets, then everything else except the pages (old pages keep working)
          aws s3 sync . "s3://$BUCKET/" --exclude '*' --include '*.js' --include '*.css' --include 'templates/*' \
            "${junk[@]}" --exclude 'docs/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync . "s3://$BUCKET/" "${junk[@]}" \
            --exclude '*.md' --exclude '*.drawio' --exclude '*/*.md' --exclude '*/*.drawio' --exclude 'docs/*' \
            --exclude '*.html' --exclude 'version.json' --exclude '*.js' --exclude '*.css' --exclude 'templates/*' \
            --cache-control 'public, max-age=86400'

          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

          # 2. pages and version.json, then drop files that are gone from the repo
          aws s3 sync . "s3://$BUCKET/" "${pages[@]}" --cache-control 'no-cache'
          aws s3 sync . "s3://$BUCKET/" --delete "${junk[@]}" \
            --exclude '*.md' --exclude '*.drawio' --exclude '*/*.md' --exclude '*/*.drawio' --exclude 'docs/*' \
            --include 'docs/admin/*'

