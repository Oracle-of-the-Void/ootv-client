name: Deploy

# dev    -> preview.oracleofthevoid.com (like sync-test.sh)
# master -> oracleofthevoid.com         (like sync-prod.sh)
on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      invalidate:
        description: 'CloudFront invalidation after the upload (prod only), only when the user asks: index = / and /index.html (2 paths), all = /*'
        type: choice
        options: [none, index, all]
        default: none

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Select target
        id: target
        run: |
          case "${{ github.ref_name }}" in
            master)
              echo "bucket=oracleofthevoid.com" >> $GITHUB_OUTPUT
              echo "distribution=E6ECGAAP7LNKR" >> $GITHUB_OUTPUT
              # never on its own (the user, 2026-11-18: "DEPLOYS ARE NOT SUPPOSED TO DO AN AUTOMATIC INVALIDATION
              # WITHOUT MY EXPRESSED INTENT"): only a manual run with invalidate picked. Versioned assets don't need
              # one: the distribution's cache key includes the v query string.
              echo "invalidate=${{ github.event_name == 'workflow_dispatch' && inputs.invalidate || 'none' }}" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "bucket=preview.oracleofthevoid.com" >> $GITHUB_OUTPUT
              echo "distribution=E2S43UTDKL45NF" >> $GITHUB_OUTPUT
              # preview's CloudFront caches nothing but robots.txt (CachingDisabled, 2026-11-09): no invalidation
              # (they cost $0.005 a path past 1,000 a month, and preview deploys were half of them)
              echo "invalidate=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "No deploy target for branch ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      # a late run (GitHub delays push events during incidents) mustn't put old code over a newer deploy
      - name: Still the newest?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/skip-stale.sh

      - name: Configure AWS credentials
        if: steps.newest.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref_name == 'master' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.REGION }}

      - name: Stamp version
        if: steps.newest.outputs.current == 'true'
        run: .github/stamp-version.sh "${GITHUB_SHA::12}"

      # preview is a copy of the live site: keep it out of search results (its canonical link already names
      # oracleofthevoid.com). A meta tag, not a robots.txt Disallow, so crawlers can read it and drop the pages.
      - name: Noindex preview
        if: steps.newest.outputs.current == 'true' && github.ref_name == 'dev'
        run: |
          sed -i 's#<meta charset="utf-8">#&\n  <meta name="robots" content="noindex">#' index.html
          grep -q 'name="robots" content="noindex"' index.html

      # Caching (see .github/stamp-version.sh):
      #   *.js, *.css               versioned (?v=<commit>) -> cached a year, immutable
      #   pages, docs               browsers revalidate every load; CloudFront keeps them an hour (below)
      #   version.json              no-cache
      #   everything else (images)   cached a day
      # CloudFront's cache key includes the v query string (prod, 2026-11-18), so oracle.js?v=new is a new object and
      # no invalidation is needed. A changed unversioned file (an image under res/) shows within a day; if it can't
      # wait, run this workflow by hand with invalidate picked, which the user asks for. Order kept: assets first,
      # pages that point at them last.
      - name: Sync to S3
        if: steps.newest.outputs.current == 'true'
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION: ${{ steps.target.outputs.distribution }}
          INVALIDATE: ${{ steps.target.outputs.invalidate }}
        run: |
          junk=(--exclude '.DS*' --exclude '._*' --exclude '.git' --exclude '.git/*' --exclude '.gitignore'
                --exclude '*/.*' --exclude '*~' --exclude '*\+' --exclude '#*' --exclude '.swp*'
                --exclude '*/#*' --exclude '*/*\+' --exclude '*/*-prev'
                --exclude '.github' --exclude '.github/*')
          pages=(--exclude '*' --include '*.html' --include 'version.json'
                 "${junk[@]}" --include 'docs/admin/*.md' --include 'docs/help/*.md')

          # 1. versioned assets, then everything else except the pages (old pages keep working)
          aws s3 sync . "s3://$BUCKET/" --exclude '*' --include '*.js' --include '*.css' \
            "${junk[@]}" --exclude 'docs/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync . "s3://$BUCKET/" "${junk[@]}" \
            --exclude '*.md' --exclude '*.drawio' --exclude '*/*.md' --exclude '*/*.drawio' --exclude 'docs/*' \
            --exclude '*.html' --exclude 'version.json' --exclude '*.js' --exclude '*.css' \
            --cache-control 'public, max-age=86400'

          # 2. pages, version.json, then drop files that are gone from the repo. Pages: browsers check every
          # time (max-age=0), CloudFront keeps a page an hour and then serves that copy while it fetches a fresh
          # one (no trip to S3 per visit: that trip doubled phone TTFB, 2026-10-14..11-18). After a deploy a
          # visitor can get the old page for up to about that long; fine (the user, 2026-11-18: "Make it an hour
          # on the cache"; "If index.html ever changes, we will do an invalidation for index.html only": a manual
          # run with invalidate = index). version.json stays no-cache: the reload offer (checkversion) must see a deploy.
          aws s3 sync . "s3://$BUCKET/" "${pages[@]}" --exclude 'version.json' \
            --cache-control 'max-age=0, s-maxage=3600, stale-while-revalidate=86400'
          aws s3 cp version.json "s3://$BUCKET/version.json" --cache-control 'no-cache'
          # browse/ is the static card, set and deck pages for search engines, built and uploaded by
          # ootv-search browse/ (prod-ootv-browse), not in this repo: never delete it. play/ is the play table, deployed by ootv-play: same
          aws s3 sync . "s3://$BUCKET/" --delete "${junk[@]}" --exclude 'browse/*' --exclude 'play/*' \
            --exclude '*.md' --exclude '*.drawio' --exclude '*/*.md' --exclude '*/*.drawio' --exclude 'docs/*' \
            --include 'docs/admin/*' --include 'docs/help/*'

          # 3. an invalidation only when the user asked for one (manual run); last, so CloudFront refetches the new files.
          # The homepage is cached as both / and /index.html.
          case "$INVALIDATE" in
            index) paths=(/ /index.html) ;;
            all)   paths=('/*') ;;
            *)     paths=() ;;
          esac
          if [ ${#paths[@]} -gt 0 ]; then
            id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "${paths[@]}" --query Invalidation.Id --output text)
            aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          fi

