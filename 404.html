<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CloudFront answers any missing page with this one and a 404 (the S3 origin says 403 for a missing key), so
     every link here is absolute. Without it search engines saw S3's AccessDenied XML: a page with no title. -->
<title>Page not found | Oracle of the Void</title>
<meta name="description" content="This page isn't on Oracle of the Void. Search every card, browse each game's sets and public decks, or open the deck builder.">
<meta name="robots" content="noindex">
<link rel="icon" href="/res/favicon.ico">
<style>
:root{--bg:#f6f3ec;--fg:#222;--muted:#666;--link:#8a1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#e8e4dc;--muted:#a49e94;--link:#e08a7a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif;text-align:center}
main{max-width:36em;margin:0 auto;padding:3em 16px}
img{width:145px;height:150px}
h1{font-size:1.6em;margin:.5em 0}
p{color:var(--muted)}
a{color:var(--link)}
ul{list-style:none;padding:0}
li{margin:.4em 0}
</style>
</head>
<body>
<main>
<img src="/res/splatout-150.png" alt="" width="145" height="150">
<h1>Page not found</h1>
<p>There's no page at this address. It may have moved, or the link may be wrong.</p>
<ul>
<li><a href="/">Search cards and build decks</a></li>
<li><a href="/browse/">Browse games, sets and public decks</a></li>
<li><a href="/browse/help">Help</a></li>
</ul>
</main>
</body>
</html>
